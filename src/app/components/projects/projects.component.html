<section class="bg-[#416e9b] py-10" id="projects">
  <h2 class="text-center text-5xl font-bold my-16 text-white">Proyectos</h2>

  <!-- filtros -->
  <div class="flex justify-center mb-6">
    <select [(ngModel)]="selectedTechnology" class="border border-gray-300 rounded-lg p-2 mr-4 bg-white">
      <option value="">Filtrar por Tecnología</option>
      <option *ngFor="let tech of technologies" [value]="tech">{{ tech }}</option>
    </select>
    <select [(ngModel)]="selectedStack" class="border border-gray-300 rounded-lg p-2 bg-white">
      <option value="">Filtrar por Stack</option>
      <option *ngFor="let st of stacks" [value]="st">{{ st }}</option>
    </select>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 px-12">
    <ng-container *ngFor="let proj of projects | slice:0:projects.length; let i = index">
      <div *ngIf="(!selectedTechnology || proj.Tecnologia.includes(selectedTechnology)) && (!selectedStack || proj.Stack === selectedStack)" 
           (click)="openModal(proj)" 
           class="cursor-pointer bg-white rounded-lg shadow-md p-4 hover:shadow-lg transition">
        <img *ngIf="proj.Imagen" [src]="proj.Imagen" [alt]="proj.Nombre" class="rounded-lg mb-4" />
        <h3 class="text-lg font-semibold">{{ proj.Nombre }}</h3>
        <p class="text-gray-600">{{ proj.Descripcion }}</p>
      </div>
    </ng-container>
  </div>

  <div *ngIf="selectedProject" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative">
      <button (click)="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">×</button>
      <h2 class="text-2xl font-bold mb-2">{{ selectedProject.Nombre }}</h2>
      <p class="mb-4 text-gray-700">{{ selectedProject.LongText }}</p>
      <p><span class="font-semibold">Tecnologías:</span> {{ selectedProject.Tecnologia.join(', ') }}</p>
      <p><span class="font-semibold">Stack:</span> {{ selectedProject.Stack }}</p>
      <img *ngIf="selectedProject.Imagen" [src]="selectedProject.Imagen" [alt]="selectedProject.Nombre" class="mt-4 rounded" />
      <a *ngIf="selectedProject.Link; else noLink" [href]="selectedProject.Link" target="_blank" rel="noopener" class="mt-4 inline-block text-blue-600 hover:underline">
        Ver más
      </a>
      <ng-template #noLink><p class="mt-4 text-gray-500">No hay link disponible</p></ng-template>
    </div>
  </div>
</section>
