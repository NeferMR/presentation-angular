<section class="p-4 shadow-lg font-mono">
  <h2 class="text-3xl font-bold mt-20 mb-4 text-black text-center">Resumen</h2>
  <ul class="list-none relative lg:py-4 lg:px-20 xl:py-4 xl:px-60">
    <h3 class="text-xl font-bold my-8 px-4 bg-[#cccccc] rounded-2xl text-black">
      EXPERIENCIA LABORAL
    </h3>
    <li *ngFor="let item of itemsExperiencia" class="flex gap-8 my-12 relative">
      <i
        class="icon-briefcase text-2xl text-white cursor-pointer p-4 bg-[#274059] rounded-full text-center mt-4 relative z-10"
      ></i>
      <div class="flex flex-col gap-4">
        <h4>{{ item.title }}</h4>
        <span class="font-bold text-[#a5a5a5]">{{ item.date }}</span>
        <p>{{ item.descripcion }}</p>
      </div>
    </li>
    <h3 class="text-xl font-bold my-8 px-4 bg-[#cccccc] rounded-2xl text-black">
      EDUCACIÓN
    </h3>
    <li *ngFor="let item of itemsEstudio" class="flex gap-8 my-12 relative">
      <i
        class="icon-briefcase text-2xl text-white cursor-pointer p-4 bg-[#274059] rounded-full text-center mt-4 relative z-10"
      ></i>
      <div class="flex flex-col gap-4">
        <h4>{{ item.title }}</h4>
        <span class="font-bold text-[#a5a5a5]">{{ item.date }}</span>
        <p>{{ item.descripcion }}</p>
      </div>
    </li>
  </ul>
</section>
